name: img2flutterscene
description: "Runtime for procedural flutter_scene models generated by img2flutterscene: PartBuilder geometry, unit primitives, and the sculpt component hierarchy."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
